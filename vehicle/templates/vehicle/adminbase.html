<!DOCTYPE html>
{% load static %}
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'assets/AT-pro-logo.png' %}"/>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4A6CF7;
            --primary-light: #6B8AFF;
            --primary-gradient: linear-gradient(135deg, #4A6CF7 0%, #7B61FF 100%);
            --secondary: #00D2FF;
            --accent: #FF6B6B;
            --success: #00D97E;
            --warning: #FFB800;
            --dark: #1A1A2E;
            --gray: #6B7280;
            --light-gray: #F3F4F6;
            --white: #FFFFFF;
            --shadow: 0 10px 40px rgba(74, 108, 247, 0.12);
            --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.04);
            --radius: 16px;
            --transition: all 0.3s ease;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #F8FAFF;
            min-height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background: white;
            border-right: 1px solid rgba(74, 108, 247, 0.06);
            padding-top: 80px;
            overflow-y: auto;
            z-index: 1000;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        
        .sidebar-nav {
            list-style: none;
            padding: 0 12px;
        }
        
        .sidebar-nav-item {
            margin-bottom: 4px;
        }
        
        .sidebar-nav-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            border-radius: 12px;
            color: var(--gray);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition);
        }
        
        .sidebar-nav-link:hover,
        .sidebar-nav-link.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 8px 25px rgba(74, 108, 247, 0.2);
            transform: translateX(4px);
        }
        
        .sidebar-nav-link div {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        
        .sidebar-nav-link:hover div,
        .sidebar-nav-link.active div {
            background: rgba(255, 255, 255, 0.15);
        }
        
        /* Navbar */
        .navbar-custom {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(74, 108, 247, 0.06);
            padding: 0 24px;
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .navbar-custom .brand {
            font-weight: 800;
            font-size: 1.3rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
        
        .navbar-custom .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .navbar-custom .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(74, 108, 247, 0.15);
            cursor: pointer;
            transition: var(--transition);
        }
        
        .navbar-custom .avatar:hover {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.1);
        }
        
        .dropdown-menu-custom {
            position: absolute;
            top: 55px;
            right: 0;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            min-width: 180px;
            padding: 8px;
            border: 1px solid rgba(74, 108, 247, 0.06);
            display: none;
            z-index: 1002;
        }
        
        .dropdown-menu-custom.show {
            display: block;
        }
        
        .dropdown-menu-custom a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 10px;
            color: var(--dark);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
        }
        
        .dropdown-menu-custom a:hover {
            background: var(--light-gray);
        }
        
        /* Content */
        .content {
            margin-left: 260px;
            padding-top: 70px;
            min-height: 100vh;
        }
        
        /* Toggle button */
        .sidebar-toggle {
            background: none;
            border: none;
            font-size: 1.4rem;
            color: var(--dark);
            cursor: pointer;
            padding: 8px;
            transition: var(--transition);
        }
        
        .sidebar-toggle:hover {
            color: var(--primary);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .content {
                margin-left: 0;
            }
        }
        
        /* Stat Cards */
        .stat-card {
            background: white;
            border-radius: var(--radius);
            padding: 24px 28px;
            border: 1px solid rgba(74, 108, 247, 0.06);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }
        
        .stat-card .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 16px;
        }
        
        .stat-card .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 4px;
        }
        
        .stat-card .stat-label {
            color: var(--gray);
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .stat-change {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 8px;
        }
        
        .stat-change.positive {
            background: rgba(0, 217, 126, 0.12);
            color: var(--success);
        }
        
        .stat-change.negative {
            background: rgba(255, 107, 107, 0.12);
            color: var(--accent);
        }
        
        /* Table Container */
        .table-container {
            background: white;
            border-radius: var(--radius);
            border: 1px solid rgba(74, 108, 247, 0.06);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        
        .table-container .table-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(74, 108, 247, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .table-container .table-header h5 {
            font-weight: 700;
            color: var(--dark);
            margin: 0;
        }
        
        .table-custom {
            margin: 0;
        }
        
        .table-custom thead th {
            background: var(--light-gray);
            color: var(--dark);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 14px 20px;
            border-bottom: none;
        }
        
        .table-custom tbody td {
            padding: 14px 20px;
            vertical-align: middle;
            color: var(--dark);
            border-bottom: 1px solid rgba(74, 108, 247, 0.04);
        }
        
        .table-custom tbody tr:hover {
            background: rgba(74, 108, 247, 0.02);
        }
        
        .badge-custom {
            padding: 4px 16px;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.75rem;
        }
        
        .badge-pending { background: rgba(255, 184, 0, 0.12); color: var(--warning); }
        .badge-approved { background: rgba(0, 210, 255, 0.12); color: var(--secondary); }
        .badge-repairing { background: rgba(74, 108, 247, 0.12); color: var(--primary); }
        .badge-done { background: rgba(0, 217, 126, 0.12); color: var(--success); }
        .badge-released { background: rgba(107, 114, 128, 0.12); color: var(--gray); }
        
        .btn-primary-custom {
            background: var(--primary-gradient);
            border: none;
            padding: 10px 28px;
            border-radius: 50px;
            font-weight: 600;
            color: white;
            transition: var(--transition);
        }
        
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74, 108, 247, 0.3);
            color: white;
        }
        
        .btn-outline-custom {
            border: 2px solid var(--primary);
            padding: 8px 24px;
            border-radius: 50px;
            font-weight: 600;
            color: var(--primary);
            background: transparent;
            transition: var(--transition);
        }
        
        .btn-outline-custom:hover {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar-custom">
        <div class="d-flex align-items-center gap-3">
            <button class="sidebar-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <a href="/admin-dashboard" class="brand">
                <i class="fas fa-car me-2"></i>VSM Admin
            </a>
        </div>
        <div class="nav-right">
            <button class="sidebar-toggle" onclick="switchTheme()">
                <i class="fas fa-moon"></i>
            </button>
            <div style="position: relative;">
                <img src="{% static 'images/admin.png' %}" alt="Admin" class="avatar" onclick="toggleDropdown()">
                <div class="dropdown-menu-custom" id="userDropdown">
                    <a href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <ul class="sidebar-nav">
            <li class="sidebar-nav-item">
                <a href="/admin-dashboard" class="sidebar-nav-link active">
                    <div><i class="fas fa-tachometer-alt"></i></div>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="sidebar-nav-item">
                <a href="/admin-customer" class="sidebar-nav-link">
                    <div><i class="fas fa-users"></i></div>
                    <span>Customers</span>
                </a>
            </li>
            <li class="sidebar-nav-item">
                <a href="/admin-mechanic" class="sidebar-nav-link">
                    <div><i class="fas fa-tools"></i></div>
                    <span>Mechanics</span>
                </a>
            </li>
            <li class="sidebar-nav-item">
                <a href="/admin-request" class="sidebar-nav-link">
                    <div><i class="fas fa-clipboard-list"></i></div>
                    <span>Requests</span>
                </a>
            </li>
            <li class="sidebar-nav-item">
                <a href="/admin-report" class="sidebar-nav-link">
                    <div><i class="fas fa-chart-bar"></i></div>
                    <span>Reports</span>
                </a>
            </li>
            <li class="sidebar-nav-item">
                <a href="/admin-feedback" class="sidebar-nav-link">
                    <div><i class="fas fa-comments"></i></div>
                    <span>Feedback</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- Content -->
    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }
        
        function toggleDropdown() {
            document.getElementById('userDropdown').classList.toggle('show');
        }
        
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.avatar') && !e.target.closest('.dropdown-menu-custom')) {
                document.getElementById('userDropdown').classList.remove('show');
            }
        });
        
        function switchTheme() {
            document.body.classList.toggle('dark-theme');
        }
        
        // Active nav link
        document.querySelectorAll('.sidebar-nav-link').forEach(link => {
            if (link.href === window.location.href) {
                link.classList.add('active');
            }
        });
    </script>
</body>
</html>
