{% extends 'vehicle/adminbase.html' %}
{% load static %}

{% block content %}
<div class="container-fluid px-4 py-4">
    <div class="row g-4">
        <div class="col-md-6">
            <div class="stat-card" style="border-left: 4px solid var(--primary);">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="stat-icon" style="background: rgba(74, 108, 247, 0.1); color: var(--primary);">
                            <i class="fas fa-eye"></i>
                        </div>
                        <h6 class="fw-bold mt-2">View Attendance</h6>
                        <p class="text-muted small">Check mechanic attendance records</p>
                    </div>
                    <a href="/admin-view-attendance" class="btn btn-primary-custom btn-sm rounded-pill px-4">
                        <i class="fas fa-arrow-right me-1"></i> View
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="stat-card" style="border-left: 4px solid var(--success);">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="stat-icon" style="background: rgba(0, 217, 126, 0.1); color: var(--success);">
                            <i class="fas fa-plus-circle"></i>
                        </div>
                        <h6 class="fw-bold mt-2">Take Attendance</h6>
                        <p class="text-muted small">Mark daily attendance for mechanics</p>
                    </div>
                    <a href="/admin-take-attendance" class="btn btn-primary-custom btn-sm rounded-pill px-4">
                        <i class="fas fa-plus me-1"></i> Take
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
