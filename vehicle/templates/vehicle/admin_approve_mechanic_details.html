{% extends 'vehicle/adminbase.html' %}
{% load widget_tweaks %}

{% block content %}
<div class="container-fluid px-4 py-4">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="form-custom">
                <h4 class="fw-bold mb-3"><i class="fas fa-user-check text-success me-2"></i>Approve Mechanic</h4>
                <p class="text-muted">Set salary and approve the mechanic</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>Salary</label>
                        {% render_field mechanicSalary.salary class="form-control" placeholder="Enter salary amount" %}
                    </div>
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-check me-2"></i> Approve Mechanic
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
