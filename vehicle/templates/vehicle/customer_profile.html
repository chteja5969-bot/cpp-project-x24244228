{% extends 'vehicle/customerbase.html' %}
{% load static %}

{% block content %}
<div class="container-fluid px-4 py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="form-custom text-center">
                <div class="mb-4">
                    <!--<img src="{ customer.profile_pic }" alt="Profile" -->
                    <!--     style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary); box-shadow: var(--shadow);">-->
                    
                    <img src="{{ customer.profile_pic.url }}" alt="Profile"
     style="width:150px; height:150px; border-radius:50%; object-fit:cover; border:4px solid var(--primary); box-shadow:var(--shadow);">
                    
                </div>
                <h3 class="fw-bold">{{ customer }}</h3>
                <p class="text-muted"><i class="fas fa-user me-2"></i>Customer</p>
                
                <div class="row g-3 mt-3 text-start">
                    <div class="col-md-6">
                        <div class="p-3 bg-light rounded-3">
                            <small class="text-muted d-block">Mobile</small>
                            <strong><i class="fas fa-phone me-2 text-primary"></i>{{ customer.mobile }}</strong>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="p-3 bg-light rounded-3">
                            <small class="text-muted d-block">Address</small>
                            <strong><i class="fas fa-map-marker-alt me-2 text-primary"></i>{{ customer.address }}</strong>
                        </div>
                    </div>
                </div>
                
                <a href="/edit-customer-profile" class="btn btn-primary-custom mt-4">
                    <i class="fas fa-edit me-2"></i> Edit Profile
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
