{% extends 'vehicle/mechanicbase.html' %}
{% load widget_tweaks %}

{% block content %}
<div class="container-fluid px-4 py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="form-custom">
                <h4 class="fw-bold mb-3"><i class="fas fa-sync-alt text-primary me-2"></i>Update Work Status</h4>
                <p class="text-muted">Update the current status of the repair work</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>Status</label>
                        {% render_field updateStatus.status class="form-control" %}
                        <small class="text-muted">Select the current progress of the repair</small>
                    </div>
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-save me-2"></i> Update Status
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
